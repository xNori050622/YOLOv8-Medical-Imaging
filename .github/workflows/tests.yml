name: regression tests

# 这 104 个用例是纯逻辑测试：不需要 GPU、数据集或权重。
# 被测模块只在函数体内 import torch / ultralytics（config.py、training.py、evaluate.py），
# 模块级只用到 numpy / cv2 / PyYAML —— 已在本地把 torch/ultralytics/PIL/matplotlib/streamlit
# 全部屏蔽后跑过一遍，104/104 通过。所以这里只装那三个包，版本与 requirements.txt 一致。
#
# 除了跑用例，这个 workflow 还做两件「只有干净环境才做得成」的守卫：
#   · tools/check_repo_consistency.py --strict  —— 断言 README 里的手写数字
#     （自述统计、用例表条数）和 workflow 里的依赖 pin 都还和仓库真实状态一致；
#   · train.py / evaluate.py --help —— 两个 CLI 入口能在没装 torch 时正常起来。
# 这两件事本地跑往往「因为恰好有数据/有 torch」而看不出问题，正是 CI 的价值所在。
#
# 用 windows-latest 而不是 ubuntu：requirements.txt 声明的平台是 Windows，启动器也是
# .bat/.ps1，CI 跑在与开发者一致的环境上才说明得了问题。
#
# 本地等价命令（见 README「Regression tests」）：每个文件都有自己的 main()
#   python tests/test_metrics.py
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: 104 regression tests + doc/CLI guards (Windows, Python 3.11)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"   # 中文报错在任意代码页的控制台上都能打印出来
    steps:
      - uses: actions/checkout@v4
        with:
          # check_repo_consistency.py 要解析被钉住的上游提交（5d13edf）来当统计基线，
          # 浅克隆里没有这个对象，所以这里要完整历史。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the three dependencies the tests actually touch
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.4.6" "opencv-python==5.0.0.93" "PyYAML==6.0.3"
          pip list

      - name: Smoke-check the two CLI entry points (no torch, no data)
        shell: pwsh
        run: |
          # train.py 模块级只 import argparse/importlib/config，evaluate.py 额外用 cv2/numpy，
          # 两个入口在 import 期都不碰 torch / ultralytics，所以这个 runner 不装 torch 也能跑。
          # 6 个测试文件只 import 被测模块、没有一个 import 这两个入口，所以「入口文件在
          # import 期就坏掉」是它们覆盖不到的故障类型，这里补上。
          foreach ($entry in 'train.py', 'evaluate.py') {
            Write-Host "=== python $entry --help ==="
            python $entry --help
            if ($LASTEXITCODE -ne 0) { throw "$entry --help failed (exit $LASTEXITCODE)" }
          }

      - name: Check the numbers the README claims are still true
        run: python tools/check_repo_consistency.py --strict

      - name: Run every regression test file
        shell: pwsh
        run: |
          $files = @(
            'tests/test_metrics.py',
            'tests/test_augment.py',
            'tests/test_make_augmented_dataset.py',
            'tests/test_make_classify_val.py',
            'tests/test_split_alignment.py',
            'tests/test_training.py'
          )
          foreach ($file in $files) {
            Write-Host "=== $file ==="
            python $file
            if ($LASTEXITCODE -ne 0) { throw "$file failed (exit $LASTEXITCODE)" }
          }
          Write-Host "all six files passed"
